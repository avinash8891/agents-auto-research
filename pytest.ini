[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore:Support for class-based `config` is deprecated:DeprecationWarning:traceloop\.sdk\.prompts\.model
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning:opentelemetry\.instrumentation\.openai_agents\.utils
markers =
    unit: unit tests
    integration: integration tests
