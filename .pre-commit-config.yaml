default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/isort
    rev: 6.1.0
    hooks:
      - id: isort
        stages: [pre-commit]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: cubic-review
        name: cubic review
        entry: scripts/cubic_review.sh origin/main
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: claude-code-simplifier
        name: claude code simplifier
        entry: scripts/claude_code_simplifier.sh origin/main
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: claude-pr-review-toolkit
        name: claude pr review toolkit
        entry: scripts/claude_pr_review_toolkit.sh origin/main
        language: system
        pass_filenames: false
        stages: [pre-push]
