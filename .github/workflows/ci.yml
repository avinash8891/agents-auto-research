name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pyyaml pre-commit pydantic bandit pandas numpy pyarrow paramiko opentelemetry-sdk==1.41.1 opentelemetry-exporter-otlp-proto-http==1.41.1 openinference-instrumentation-openai==0.1.45 traceloop-sdk==0.60.0 httpx mcp
      - name: Code quality checks (pre-commit)
        run: pre-commit run --all-files
      - name: Security scan (bandit) — high severity, fail on any new issue
        run: bandit -r autoresearch_*.py agent_*.py research_conductor.py compiler_pipeline.py vps_runner.py --severity-level high
      - name: Prompt drift check
        run: python scripts/check_prompt_drift.py
      - name: Run tests with coverage
        run: |
          pytest -v --cov --cov-report=term-missing
