name: CI

on:
  push:
    branches: [main, v1-autoresearch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml ruff black isort pydantic bandit
      - name: Lint (ruff)
        run: ruff check autoresearch_*.py tests/
      - name: Format check (black)
        run: black --check autoresearch_*.py tests/
      - name: Import sort check (isort)
        run: isort --check-only autoresearch_*.py tests/
      - name: Security scan (bandit) — high severity, fail on any new issue
        run: bandit -r autoresearch_*.py --severity-level high
      - name: Run tests with coverage
        run: |
          pytest -v \
            --cov=autoresearch_loop \
            --cov=autoresearch_state \
            --cov=autoresearch_artifacts \
            --cov=autoresearch_planning \
            --cov=autoresearch_research \
            --cov=autoresearch_experiment \
            --cov-report=term-missing
