name: CI

on:
  push:
    branches: [main, v1-autoresearch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov pyyaml ruff black isort pydantic bandit pandas numpy pyarrow paramiko
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Import sort check (isort)
        run: isort --check-only .
      - name: Security scan (bandit) — high severity, fail on any new issue
        run: bandit -r autoresearch_*.py agent_*.py research_conductor.py compiler_pipeline.py --severity-level high
      - name: Run tests with coverage
        run: |
          pytest -v --cov --cov-report=term-missing
