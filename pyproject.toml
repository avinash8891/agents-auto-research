[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "autoresearch_loop",
    "autoresearch_state",
    "autoresearch_artifacts",
    "autoresearch_planning",
    "autoresearch_research",
    "autoresearch_experiment",
    "autoresearch_helper",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E402: module-level import not at top — tests intentionally insert sys.path
#       manipulation before importing the project modules.
# F401: imported but unused — autoresearch_loop intentionally re-exports
#       _notify_discord for back-compat with test monkeypatch sites; the
#       __all__ tuple makes the re-export explicit.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# autoresearch_helper.py is a CLI script; some prints use plain strings.
"autoresearch_helper.py" = ["F541"]

[tool.coverage.run]
source = [
    "autoresearch_loop",
    "autoresearch_state",
    "autoresearch_artifacts",
    "autoresearch_planning",
    "autoresearch_research",
    "autoresearch_experiment",
]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
# Initial gate set to 70% on the union of autoresearch_* modules. Will
# ratchet to 80% once integration test fixtures land in PR 5.
fail_under = 70
